# BJFC Command Centre: send every request (except Let's Encrypt challenges) to the Node app on :4310 (pm2 bjfc-sa).
# Installed at /etc/nginx-rc/extra.d/bjfc-sa.location.main-before.node.conf
location ~ ^/(?!\.well-known)(.*)$ {
    proxy_pass http://127.0.0.1:4310/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;
}
