<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#222654" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BJFC" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>BJFC Command Centre</title>
  <link rel="icon" href="logo-small.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme before paint to avoid a flash
    try { const t = localStorage.getItem("bjfc-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><img src="logo.png" alt="BJFC Consulting Engineers" /></div>
        <div class="name">Command Centre<small>BJ-FC Consulting Engineers</small></div>
        <button class="icon-btn nav-close" id="nav-close" aria-label="Close menu"><svg class="i"><use href="#i-x" /></svg></button>
      </div>
      <nav class="nav" id="nav">
        <a href="#/overview" data-page="overview"><svg class="i"><use href="#i-home" /></svg>Overview</a>
        <a href="#/assistant" data-page="assistant"><svg class="i"><use href="#i-spark" /></svg>AI Assistant</a>
        <div class="nav-label">Business</div>
        <a href="#/documents?type=quote" data-page="quotes"><svg class="i"><use href="#i-quote" /></svg>Quotes<span class="count" id="n-quotes"></span></a>
        <a href="#/documents?type=invoice" data-page="invoices"><svg class="i"><use href="#i-invoice" /></svg>Invoices<span class="count" id="n-invoices"></span></a>
        <a href="#/documents" data-page="documents"><svg class="i"><use href="#i-folder" /></svg>All files<span class="count" id="n-files"></span></a>
        <div class="nav-label">Environment</div>
        <a href="#/monitor" data-page="monitor"><svg class="i"><use href="#i-pulse" /></svg>System monitor<span class="count" id="n-alerts"></span></a>
        <a href="#/sources" data-page="sources"><svg class="i"><use href="#i-db" /></svg>Data sources</a>
        <a href="#/settings" data-page="settings"><svg class="i"><use href="#i-gear" /></svg>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip"><span class="av" id="user-av"></span><div class="who"><b id="user-name"></b><small id="user-email"></small></div><button class="icon-btn" id="logout" title="Sign out" aria-label="Sign out"><svg class="i"><use href="#i-logout" /></svg></button></div>
        <div class="ai-pill" id="ai-pill"><span class="dot"></span><div><b id="ai-pill-t">Connecting…</b><small id="ai-pill-s"></small></div></div>
      </div>
    </aside>

    <div class="nav-scrim" id="nav-scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><svg class="i"><use href="#i-menu" /></svg></button>
        <div><h1 id="page-title">Overview</h1><div class="sub" id="page-sub"></div></div>
        <div class="spacer"></div>
        <form class="search" id="global-search"><svg class="i"><use href="#i-search" /></svg><input type="search" placeholder="Search all files, quotes, invoices…" /></form>
        <button class="icon-btn search-btn" id="search-btn" aria-label="Search files"><svg class="i"><use href="#i-search" /></svg></button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle light / dark mode" title="Toggle light / dark mode"><svg class="i"><use href="#i-moon" /></svg></button>
      </header>
      <main class="content"><div class="page" id="view"></div></main>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main">
      <a href="#/overview" data-page="overview"><svg class="i"><use href="#i-home" /></svg>Home</a>
      <a href="#/assistant" data-page="assistant"><svg class="i"><use href="#i-spark" /></svg>Ask AI</a>
      <a href="#/documents?type=invoice" data-page="invoices"><svg class="i"><use href="#i-invoice" /></svg>Invoices</a>
      <a href="#/documents?type=quote" data-page="quotes"><svg class="i"><use href="#i-quote" /></svg>Quotes</a>
      <a href="#/monitor" data-page="monitor"><svg class="i"><use href="#i-pulse" /></svg>Monitor<span class="dot" id="bn-alerts" hidden></span></a>
    </nav>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-invoice" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-nas" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </svg>
  <script src="app.js" type="module"></script>
</body>
</html>
